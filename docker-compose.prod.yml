# Production / VPS policy overlay.
# Use: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.caddy.yml up -d
# For GHCR deploys: TAG=<sha|staging|production> ... pull && up -d
# NOTE: dev bind-mounts live in docker-compose.override.yml, which is NOT loaded
# when -f flags are given - so VPS runs pure image + named volumes.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/sesaputra/absensi-mkp:${TAG:-latest}
    # Writable Laravel dirs as named volumes (union with base = same set, explicit).
    volumes:
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
      - public_data:/var/www/public
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    restart: always

  webserver:
    volumes:
      # Built public assets shared from app image (read-only). No source bind-mount.
      - public_data:/var/www/public:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      # Share storage for user uploads if you use public/storage
      - storage_data:/var/www/storage:ro
    restart: always

  db:
    # Do not expose MySQL to host in prod - Caddy/app network only
    ports: []
    restart: always

volumes:
  storage_data:
    driver: local
  cache_data:
    driver: local
  public_data:
    driver: local
