services:
  # Service PHP-FPM (Aplikasi Laravel)
  # Prod-shape base: immutable image + named volumes. No source bind-mounts here.
  # Local dev bind-mounts live in docker-compose.override.yml (auto-loaded, never on VPS).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/sesaputra/absensi-mkp:${TAG:-latest}
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      # Override defaults to work inside Docker network if .env still has sqlite/127.0.0.1
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-absensi_mkp}
      DB_USERNAME: ${DB_USERNAME:-laravel_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      # Ensure APP_URL points to nginx
      APP_URL: ${APP_URL:-http://localhost:8000}
    volumes:
      # Writable Laravel dirs as named volumes (seeded from image, www-data owned).
      # public_data is shared read-only with webserver so nginx serves built assets.
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
      - public_data:/var/www/public
    networks:
      - laravel_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"if(@fsockopen('127.0.0.1',9000)) exit(0); exit(1);\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  # Service Nginx (Web Server)
  webserver:
    image: nginx:alpine
    container_name: laravel_webserver
    restart: unless-stopped
    volumes:
      # Built assets shared from app image (read-only). No source bind-mounts.
      - public_data:/var/www/public:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - laravel_network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # /up is Laravel's free health route (no session/DB-table touch)
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Service MySQL (Database)
  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    # Exposed for local debugging only - nulled in prod override
    ports:
      - "127.0.0.1:3306:3306"
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-absensi_mkp}
      # MySQL image errors if MYSQL_USER=root. Init user is always a dedicated app user.
      # If .env has DB_USERNAME=root, Laravel connects as root using MYSQL_ROOT_PASSWORD
      # (DB_ROOT_PASSWORD, falling back to DB_PASSWORD).
      MYSQL_USER: ${DB_APP_USER:-laravel_user}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:-${DB_PASSWORD:-secret}}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-secret}}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent || mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  laravel_network:
    driver: bridge

volumes:
  # db_data persists across deploys - NEVER delete casually.
  db_data:
    driver: local
  # Uploads, logs file fallback, sessions file fallback (if ever used).
  storage_data:
    driver: local
  # Regenerated by entrypoint every boot (config:clear/cache). Safe to drop.
  cache_data:
    driver: local
  # Seeded from app image (public/build). Shared ro with webserver.
  public_data:
    driver: local
